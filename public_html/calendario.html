<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Totalplay | Te Invita</title>
    <meta name="description"
        content="Eventos exclusivos en San Luis Potosí. Música, teatro, arte y más — directo de Totalplay.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap"
        rel="stylesheet">
    <!-- Leaflet.js para el mapa -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Lucide icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/calendario.css">
    <style>
        /* ── Popup oscuro Leaflet ── */
        .ev-leaflet-popup .leaflet-popup-content-wrapper {
            background: rgba(12, 12, 24, 0.72);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            padding: 0;
            overflow: hidden;
        }

        .ev-leaflet-popup .leaflet-popup-tip-container {
            display: none;
        }

        .ev-leaflet-popup .leaflet-popup-content {
            margin: 0;
        }

        .ev-popup {
            padding: 0;
            min-width: 200px;
            overflow: hidden;
            border-radius: 18px;
            background: #0d0d12;
        }

        .ev-popup-img {
            width: 100%;
            height: 90px;
            object-fit: cover;
            display: block;
        }

        .ev-popup-body {
            padding: 12px 14px 14px;
        }

        .ev-popup-top {
            margin-bottom: 7px;
        }

        .ev-popup-name {
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 800;
            color: #fff;
            line-height: 1.2;
            margin-bottom: 8px;
            letter-spacing: -0.2px;
        }

        .ev-popup-row {
            font-family: 'Inter', sans-serif;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 4px;
            line-height: 1.4;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .ev-popup-row svg {
            width: 12px;
            height: 12px;
            flex-shrink: 0;
            opacity: 0.7;
        }

        .ev-popup-btn {
            margin-top: 10px;
            width: 100%;
            padding: 9px 0;
            background: #af52de;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            font-weight: 800;
            cursor: pointer;
            letter-spacing: 0.2px;
            transition: opacity 0.2s, transform 0.15s;
        }

        .share-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .share-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.05);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .share-btn:active {
            transform: scale(0.95);
        }

        .share-btn-popup {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 5;
            background: rgba(10, 10, 18, 0.6);
            backdrop-filter: blur(8px);
        }

        .ev-popup-btn:active {
            opacity: 0.8;
            transform: scale(0.97);
        }

        /* Fade del mapa al abrir popup */
        .leaflet-tile-pane {
            transition: filter 0.4s ease, opacity 0.4s ease;
        }

        body:not(.light-theme) .leaflet-tile-pane {
            filter: invert(100%) hue-rotate(180deg) brightness(0.95) contrast(0.8);
        }

        body.light-theme .leaflet-tile-pane {
            filter: none !important;
        }

        body:not(.light-theme) .leaflet-tile-pane.map-dimmed {
            filter: invert(100%) hue-rotate(180deg) brightness(0.25) contrast(0.8) !important;
            opacity: 0.7;
        }

        body.light-theme .leaflet-tile-pane.map-dimmed {
            filter: brightness(0.25) saturate(0.3) !important;
            opacity: 0.7;
        }

        /* Fade del header y pill al abrir popup */
        .cal-header,
        .location-pill {
            transition: opacity 0.35s ease, transform 0.35s ease;
        }

        .cal-header.ui-dimmed,
        .location-pill.ui-dimmed {
            opacity: 0;
            pointer-events: none;
            transform: translateY(-6px);
        }

        /* ── Botón de Like (corazón) ── */
        .like-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 999px;
            padding: 5px 10px;
            color: rgba(255, 255, 255, 0.55);
            font-family: 'Inter', sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            line-height: 1;
        }

        .like-btn svg {
            width: 14px;
            height: 14px;
            stroke: rgba(255, 255, 255, 0.55);
            fill: none;
            transition: stroke 0.2s, fill 0.2s, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .like-btn.liked {
            background: rgba(255, 59, 92, 0.15);
            border-color: rgba(255, 59, 92, 0.4);
            color: #ff3b5c;
        }

        .like-btn.liked svg {
            stroke: #ff3b5c;
            fill: #ff3b5c;
        }

        .like-btn.pop svg {
            transform: scale(1.5);
        }

        @keyframes heart-pop {
            0% {
                transform: scale(1);
            }

            40% {
                transform: scale(1.55);
            }

            70% {
                transform: scale(0.9);
            }

            100% {
                transform: scale(1);
            }
        }

        /* Like en drawer (más grande) */
        .like-btn-detail {
            gap: 7px;
            padding: 10px 18px;
            font-size: 0.85rem;
        }

        .like-btn-detail svg {
            width: 18px;
            height: 18px;
        }

        /* ── Ajuste de Imagen (Zoom Out / Contain) ── */
        .event-card-img,
        .detail-hero {
            object-fit: contain !important;
            background-color: #000;
            /* Efecto de fondo borroso opcional */
            background-image: var(--bg-url);
            background-size: cover;
            background-position: center;
        }

        /* ── Contenedor de Video/Embed ── */
        .detail-video-wrapper {
            margin-top: 22px;
            width: 100%;
            border-radius: 18px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
        }

        .detail-video-wrapper iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: none;
            display: block;
        }

        .detail-video-wrapper.tiktok-wrapper {
            max-width: 340px;
            margin-left: auto;
            margin-right: auto;
        }

        .detail-video-wrapper.tiktok-blockquote-wrapper {
            overflow: visible;
            background: transparent;
            border: none;
        }

        .detail-video-wrapper.tiktok-wrapper iframe {
            aspect-ratio: 9 / 16;
            min-height: 560px;
        }

        /* Ajuste para embeds de Instagram/TikTok */
        .detail-video-wrapper .instagram-media,
        .detail-video-wrapper blockquote {
            margin: 0 !important;
            width: 100% !important;
            min-width: 100% !important;
            border-radius: 18px !important;
        }

        /* ── Logo Totalplay en Detalle ── */
        .detail-hero-container {
            position: relative;
            width: 100%;
        }

        .detail-brand-logo {
            position: absolute;
            top: 15px;
            left: 15px;
            height: 18px;
            /* Aún más pequeño y elegante */
            width: auto;
            z-index: 10;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.5));
            pointer-events: none;
            padding: 0;
            border-radius: 0;
            backdrop-filter: none;
            background: none;
        }

        /* ── SHARE MODAL (Instagram Style) ── */
        /* ── SHARE MODAL (Instagram Style) ── */
        .share-modal {
            position: fixed;
            inset: 0;
            z-index: 6000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .share-modal.open {
            opacity: 1;
            pointer-events: all;
        }

        .share-modal-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .share-modal-content {
            position: relative;
            background: rgba(18, 18, 20, 0.65);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            width: 90%;
            max-width: 370px;
            border-radius: 30px;
            overflow: hidden;
            transform: scale(0.9) translateY(20px);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .share-modal.open .share-modal-content {
            transform: scale(1) translateY(0);
        }

        .share-modal-header {
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
        }

        .share-modal-header h3 {
            font-size: 1.05rem;
            font-weight: 800;
            color: #fff;
            margin: 0;
            letter-spacing: -0.3px;
        }

        .share-modal-close {
            position: absolute;
            right: 18px;
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: #fff;
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .share-modal-close:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: rotate(90deg);
        }

        .share-modal-body {
            padding: 8px 0;
        }

        .share-option {
            width: 100%;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            transition: background 0.2s;
            text-align: left;
        }

        .share-option:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .share-option-icon {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            opacity: 0.95;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .share-option-icon i,
        .share-option-icon svg {
            width: 20px;
            height: 20px;
            display: block;
            stroke-width: 2.5px;
        }

        /* Estilo para el resumen de eventos próximos */
        .upcoming-summary {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: -20px;
            margin-bottom: 25px;
            font-weight: 500;
            letter-spacing: -0.2px;
            animation: fadeInSlide 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .upcoming-summary b {
            color: #8B5CF6;
            font-weight: 800;
            background: rgba(139, 92, 246, 0.1);
            padding: 2px 8px;
            border-radius: 6px;
            margin: 0 2px;
        }

        @keyframes fadeInSlide {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .date-pill .month-label {
            font-size: 0.58rem;
            color: var(--cal-dim);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-top: -1px;
            transition: color 0.3s ease;
        }

        .date-pill.month-divider {
            position: relative;
            margin-left: 8px;
        }

        .date-pill.month-divider::before {
            content: '';
            position: absolute;
            left: -10px;
            top: 20%;
            bottom: 20%;
            width: 1.5px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 1px;
        }

        .share-option span {
            font-size: 0.98rem;
            font-weight: 600;
            letter-spacing: -0.2px;
        }

        /* ── PARTICIPATION FORM MODAL ── */
        .info-box-cta {
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s !important;
        }

        .info-box-cta:hover {
            transform: translateY(-2px) !important;
        }

        .participation-modal {
            position: fixed;
            inset: 0;
            z-index: 4000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .participation-modal.open {
            opacity: 1;
            pointer-events: all;
        }

        .participation-modal-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .participation-modal-content {
            position: relative;
            background: rgba(12, 12, 20, 0.72);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            width: 92%;
            max-width: 440px;
            border-radius: 28px;
            overflow: hidden;
            transform: scale(0.92) translateY(24px);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .participation-modal.open .participation-modal-content {
            transform: scale(1) translateY(0);
        }

        .participation-modal-header {
            padding: 20px 22px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .participation-modal-header h3 {
            font-size: 1.05rem;
            font-weight: 800;
            color: #fff;
            margin: 0;
            letter-spacing: -0.3px;
        }

        .participation-modal-close {
            background: rgba(255, 255, 255, 0.07);
            border: none;
            color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .participation-modal-close:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: rotate(90deg);
        }

        .participation-modal-body {
            padding: 20px 22px 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .pform-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .pform-group>label {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: rgba(255, 255, 255, 0.45);
        }

        .pform-group input[type="text"],
        .pform-group input[type="tel"],
        .pform-group input[type="email"] {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 12px 16px;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 500;
            outline: none;
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
            width: 100%;
            box-sizing: border-box;
            font-family: inherit;
            text-transform: uppercase;
        }

        .pform-group input[type="text"]:focus,
        .pform-group input[type="tel"]:focus,
        .pform-group input[type="email"]:focus {
            border-color: rgba(139, 92, 246, 0.6);
            background: rgba(139, 92, 246, 0.08);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
        }

        .pform-group input::placeholder {
            color: rgba(255, 255, 255, 0.22);
            text-transform: none;
        }

        .pform-radio-group {
            display: flex;
            gap: 10px;
        }

        .pform-radio-option {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px 14px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.92rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.55);
            user-select: none;
        }

        .pform-radio-option input[type="radio"] {
            display: none;
        }

        .pform-radio-option:has(input:checked) {
            background: rgba(139, 92, 246, 0.18);
            border-color: rgba(139, 92, 246, 0.5);
            color: #fff;
        }

        .pform-radio-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
            position: relative;
        }

        .pform-radio-option:has(input:checked) .pform-radio-dot {
            border-color: #8B5CF6;
            background: #8B5CF6;
            box-shadow: 0 0 8px rgba(139, 92, 246, 0.5);
        }

        .pform-radio-dot::after {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #fff;
            opacity: 0;
            transition: opacity 0.2s;
            position: absolute;
        }

        .pform-radio-option:has(input:checked) .pform-radio-dot::after {
            opacity: 1;
        }

        #pform-cuenta-group {
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            transition: max-height 0.35s ease, opacity 0.3s ease;
            pointer-events: none;
        }

        #pform-cuenta-group.visible {
            max-height: 100px;
            opacity: 1;
            pointer-events: auto;
        }

        .pform-submit {
            margin-top: 2px;
            padding: 14px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, #7d54aa, #d94389);
            color: #fff;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 0.2px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 20px rgba(125, 84, 170, 0.45);
            width: 100%;
            font-family: inherit;
        }

        .pform-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(125, 84, 170, 0.6);
        }

        .pform-submit:active {
            transform: translateY(0);
        }

        /* Checkbox personalizado para Términos */
        .pform-checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin: 10px 0 15px;
            cursor: pointer;
            user-select: none;
        }

        .pform-checkbox-group input {
            display: none;
        }

        .pform-checkbox-box {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            margin-top: 2px;
        }

        .pform-checkbox-group:hover .pform-checkbox-box {
            border-color: rgba(139, 92, 246, 0.5);
        }

        .pform-checkbox-group input:checked+.pform-checkbox-box {
            background: #8B5CF6;
            border-color: #8B5CF6;
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.4);
        }

        .pform-checkbox-box::after {
            content: '✓';
            color: #fff;
            font-size: 12px;
            font-weight: 900;
            display: none;
        }

        .pform-checkbox-group input:checked+.pform-checkbox-box::after {
            display: block;
        }

        .pform-checkbox-text {
            font-size: 0.78rem;
            line-height: 1.4;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 500;
        }

        body.light-theme .pform-checkbox-box {
            border-color: rgba(0, 0, 0, 0.15);
        }

        body.light-theme .pform-checkbox-text {
            color: rgba(0, 0, 0, 0.6);
        }

        .pform-privacy-link {
            display: block;
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.35);
            text-decoration: none;
            margin-top: -5px;
            margin-bottom: 10px;
            text-align: center;
            transition: all 0.2s;
            font-weight: 500;
        }

        .pform-privacy-link:hover {
            color: #8B5CF6;
            text-decoration: underline;
        }

        body.light-theme .pform-privacy-link {
            color: rgba(0, 0, 0, 0.4);
        }

        /* ============================================================
           DESKTOP ADAPTATION (Premium Triple-Column Layout)
           ============================================================ */
        @media (min-width: 1024px) {
            :root {
                --cal-accent: #7d54aa;
                --cal-accent-pink: #d94389;
                --brand-gradient: linear-gradient(60deg, #7d54aa 0%, #d94389 100%);
                --cal-glass: rgba(255, 255, 255, 0.05);
                --cal-glass-border: rgba(255, 255, 255, 0.1);
            }

            body {
                overflow: hidden !important;
                background: #000 !important;
            }

            .cal-wrapper {
                max-width: none !important;
                display: grid !important;
                /* 3 columns: sidebar | event feed | map */
                grid-template-columns: 90px 1fr 480px !important;
                grid-template-rows: 82px 1fr !important;
                height: 100vh !important;

        function formatDateKey(d) {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${dd}`;
        }
        function addDays(d, n) {
            const r = new Date(d);
            r.setDate(r.getDate() + n);
            return r;
        }
        function parseDateKey(str) {
            const [y, m, d] = str.split('-').map(Number);
            return new Date(y, m - 1, d);
        }

        // Normalizar fecha de DD/MM/YYYY a YYYY-MM-DD
        function normalizeDate(str) {
            if (!str) return '';
            str = str.trim().replace(/^"|"$/g, '');
            const parts = str.split('/');
            if (parts.length === 3) {
                const d = parts[0].padStart(2, '0');
                const m = parts[1].padStart(2, '0');
                const y = parts[2];
                return `${y}-${m}-${d}`;
            }
            return str;
        }

        // Helper para convertir links de Google Drive en links directos de imagen
        function getImageUrl(url, nombre) {
            // Hardcoded override for Cross Tamasopo as requested
            if (nombre && nombre.toLowerCase().includes('cross tamasopo')) {
                return 'assets/cross_tamasopo/carreratpcross.jpeg';
            }
            if (!url) return 'https://images.unsplash.com/photo-1470229722913-7c0e2dbbafd3?w=800&q=60';
            url = url.trim().replace(/^"|"$/g, '');
            // Extraer el ID de Google Drive de cualquier formato de URL conocido
            const driveFileMatch = url.match(/\/file\/d\/([-\w]{25,})/);
            const driveOpenMatch = url.match(/[?&]id=([-\w]{25,})/);
            const driveIdMatch = driveFileMatch ? driveFileMatch[1] : (driveOpenMatch ? driveOpenMatch[1] : null);
            if (url.includes('drive.google.com') && driveIdMatch) {
                // lh3.googleusercontent.com es mucho más fiable para servir imágenes de Drive en la web
                return `https://lh3.googleusercontent.com/d/${driveIdMatch}=s1000`;
            }
            // Fallback: intentar extraer ID con regex genérica
            if (url.includes('drive.google.com')) {
                const genericId = url.match(/[-\w]{25,}/);
                if (genericId) return `https://lh3.googleusercontent.com/d/${genericId[0]}=s1000`;
            }
            if (url.startsWith('www.')) url = 'https://' + url;
            else if (!url.startsWith('http') && !url.startsWith('/') && !url.startsWith('data:')) {
                url = 'https://' + url;
            }
            return url;
        }

        function getLikedEvents() {

        function saveLikedEvents(set) {

        async function sendLike(eventoId) {
            // 1. Si está configurado APPS_SCRIPT_URL con un valor válido, usarlo directamente
            if (typeof APPS_SCRIPT_URL !== 'undefined' && APPS_SCRIPT_URL && !APPS_SCRIPT_URL.includes('TU_APPS_SCRIPT_URL_AQUI')) {
                try {
                    // Usamos text/plain para evitar el preflight CORS de Apps Script
                    const res = await fetch(APPS_SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify({ id: eventoId }),
                        redirect: 'follow'
                    });
                    const data = await res.json();
                    return data.likes;
                } catch (e) {
                    console.warn('Like no enviado al Apps Script:', e.message);
                    return null;
                }
            }

            // 2. Si no, usar el Node.js backend si está configurado
            if (typeof API_BASE !== 'undefined' && API_BASE) {
                try {
                    const res = await fetch(`${API_BASE}/api/eventos/like`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id: eventoId })
                    });
                    const data = await res.json();
                    return data.likes;
                } catch (e) {
                    console.warn('Like no enviado al backend:', e.message);
                    return null;
                }
            }

            // Sin servidor ni Apps Script configurado
            return null;
        }

        function handleLike(e, eventoId, btnEl, countEl) {
            e.stopPropagation();
            const liked = getLikedEvents();
            const isLiked = liked.has(eventoId);

            // Actualizar localStorage
            if (isLiked) { liked.delete(eventoId); }
            else { liked.add(eventoId); }
            saveLikedEvents(liked);

            // Actualizar UI localmente (optimista)
            const ev = allEvents.find(ev => ev.id === eventoId);
            if (!ev) return;
            if (!isLiked) {
                ev._likes = (ev._likes || 0) + 1;
                btnEl.classList.add('liked');
                btnEl.classList.add('pop');
                createFloatingHearts(btnEl);
                setTimeout(() => btnEl.classList.remove('pop'), 400);
            } else {
                ev._likes = Math.max(0, (ev._likes || 1) - 1);
                btnEl.classList.remove('liked');
            }
            if (countEl) countEl.textContent = ev._likes;

            // Sincronizar con el servidor (solo si es like, no unlike)
            if (!isLiked) sendLike(eventoId).then(serverCount => {
                if (serverCount !== null && ev) {
                    ev._likes = serverCount;
                    if (countEl) countEl.textContent = serverCount;
                }
            });

            // Sincronizar todos los botones del mismo evento
            document.querySelectorAll(`[data-like-id="${eventoId}"]`).forEach(btn => {
                if (btn !== btnEl) {
                    btn.classList.toggle('liked', !isLiked);
                    const cnt = btn.querySelector('.like-count');
                    if (cnt && ev) cnt.textContent = ev._likes;
                }
            });
        }

        function createFloatingHearts(el) {
            if (!el) return;
            const rect = el.getBoundingClientRect();
            const container = document.body;
            const heartEmojis = ['❤️', '💜', '💖', '💕'];
            
            for (let i = 0; i < 6; i++) {
                const heart = document.createElement('span');
                heart.className = 'floating-heart';
                heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
                
                const offsetX = (Math.random() - 0.5) * 30; // -15px to 15px
                const offsetY = (Math.random() - 0.5) * 10;
                const rotation = (Math.random() - 0.5) * 60; // -30deg to 30deg
                const delay = Math.random() * 0.25;
                
                heart.style.left = (window.scrollX + rect.left + rect.width / 2 + offsetX - 10) + 'px';
                heart.style.top = (window.scrollY + rect.top + rect.height / 2 + offsetY - 10) + 'px';
                heart.style.setProperty('--rot', rotation + 'deg');
                heart.style.animationDelay = delay + 's';
                
                container.appendChild(heart);
                
                setTimeout(() => heart.remove(), 1500);
            }
        }

        async function submitParticipation() {
            const nombre = document.getElementById('pform-nombre').value.trim();
            const whatsapp = document.getElementById('pform-whatsapp').value.trim();
            const email = document.getElementById('pform-email').value.trim();
            const esCliente = document.querySelector('input[name="pform-cliente"]:checked')?.value === 'si';
            const cuenta = document.getElementById('pform-cuenta').value.trim();

            const acceptTerms = document.getElementById('pform-accept').checked;

            // Helpers de validación
            const validateEmail = (email) => {
                return String(email)
                    .toLowerCase()
                    .match(/^(([^<>()[\]\\.,;:\s@"]+(\.[^<>()[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/);
            };
            const validatePhone = (phone) => {
                const clean = phone.replace(/\D/g, '');
                return clean.length === 10;
            };

            // Validar campos requeridos y formato
            let valid = true;

            // 1. Validar Nombre
            if (!nombre) {
                showError('pform-nombre');
                valid = false;
            }

            // 2. Validar WhatsApp (10 dígitos)
            if (!validatePhone(whatsapp)) {
                showError('pform-whatsapp');
                valid = false;
            }

            // 3. Validar Email (Opcional, pero si hay texto debe ser válido)
            if (email && !validateEmail(email)) {
                showError('pform-email');
                valid = false;
            }

            // Validar términos (Ahora es OPCIONAL, no bloquea el registro)
            // Ya no cambiamos valid a false aquí

            if (!valid) return;

            function showError(id) {
                const el = document.getElementById(id);
                el.style.borderColor = '#ff4757';
                el.style.boxShadow = '0 0 0 3px rgba(255,71,87,0.2)';
                setTimeout(() => { el.style.borderColor = ''; el.style.boxShadow = ''; }, 2500);
            }

            const btn = document.querySelector('.pform-submit');
            const eventoNombre = eventToParticipate?.nombre || '';

            // Enviar al Google Sheet si la URL está configurada
            if (REGISTROS_SCRIPT_URL && !REGISTROS_SCRIPT_URL.includes('PEGA_AQUI')) {
                btn.textContent = 'Enviando...';
                btn.disabled = true;
                btn.style.opacity = '0.7';
                try {
                    await fetch(REGISTROS_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ evento: eventoNombre, nombre, whatsapp, esCliente, cuenta, email, autoriza: acceptTerms })
                    });
                    btn.textContent = '¡Registro enviado!';
                    btn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
                    btn.style.opacity = '1';
                    setTimeout(() => closeParticipationModal(), 1800);
                } catch (err) {
                    btn.textContent = 'Participar';
                    btn.disabled = false;
                    btn.style.opacity = '1';
                }
            } else {
                // Fallback: WhatsApp si no hay URL configurada
                let msg = `¡Hola! Quiero participar en *${eventoNombre}*\n\n`;
                msg += `👤 Nombre: ${nombre}\n`;
                msg += `📱 WhatsApp: ${whatsapp}\n`;
                msg += `📧 Correo: ${email}\n`;
                if (esCliente && cuenta) msg += `🔢 Cuenta: ${cuenta}\n`;
                msg += `\n_Enviado desde Totalplay te invita_`;
                window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');

        function shareTo(platform) {
            if (!eventToShare) return;

            const title = eventToShare.nombre;
            const text = `¡Totalplay te Invita a este evento! ${eventToShare.nombre}`;
            const url = window.location.href;
            const encodedUrl = encodeURIComponent(url);

            let shareUrl = '';

            switch (platform) {
                case 'threads':
                    shareUrl = `https://threads.net/intent/post?text=${encodedText}`;
                    break;
                case 'whatsapp':
                    shareUrl = `https://api.whatsapp.com/send?text=${encodedText}`;
                    break;
                case 'facebook':
                    shareUrl = `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`;
                    break;
                case 'messenger':
                    // Messenger web link o app protocol
                    shareUrl = `fb-messenger://share/?link=${encodedUrl}`;
                    if (navigator.userAgent.match(/iPhone|iPad|iPod|Android/i)) {
                        window.location.href = shareUrl;
                    } else {
                        shareUrl = `https://www.facebook.com/dialog/send?link=${encodedUrl}&app_id=291494419107518&redirect_uri=${encodedUrl}`;
                    }
                    break;
                case 'twitter':
                    shareUrl = `https://twitter.com/intent/tweet?text=${encodedText}`;
                    break;
                case 'email':
                    shareUrl = `mailto:?subject=${encodeURIComponent(title)}&body=${encodedText}`;
                    break;
                case 'qr':
                    shareUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodedUrl}`;
                    break;
                case 'copy':
                    navigator.clipboard.writeText(url).then(() => {
                        alert('¡Enlace copiado al portapapeles!');
                        closeShareModal();
                    });
                    return;
            }

            if (shareUrl) {
                window.open(shareUrl, '_blank');
                closeShareModal();
            }
        }

                const btnList = document.getElementById('btn-view-list');

                const wrapper = document.querySelector('.cal-wrapper');
                const mapEl = document.getElementById('cal-map');
                const themeBtn = document.getElementById('theme-toggle-btn');

                // Toggle Tema
                if (themeBtn) themeBtn.addEventListener('click', toggleTheme);

                if (btnList) btnList.addEventListener('click', () => {
                    btnList.classList.add('active');
                    btnMap.classList.remove('active');
                    wrapper.classList.add('map-off');
                    mapEl.classList.add('hidden');
                });

                if (btnMap) btnMap.addEventListener('click', () => {
                    btnMap.classList.add('active');
                    btnList.classList.remove('active');
                    wrapper.classList.remove('map-off');
                    mapEl.classList.remove('hidden');

                    setTimeout(() => {
                        if (leafletMap) leafletMap.invalidateSize();
                    }, 300);

                    setTimeout(() => {
                        if (mapMarkers.length === 1) {
                            const marker = mapMarkers[0].marker || mapMarkers[0];
                            leafletMap.flyTo(marker.getLatLng(), 16, { duration: 0.8 });
                        } else if (mapMarkers.length > 1) {
                            const group = L.featureGroup(mapMarkers.map(m => m.marker || m));
                            leafletMap.fitBounds(group.getBounds().pad(0.3), { animate: true });
                        } else {
                            leafletMap.flyTo(MAP_CENTER, MAP_ZOOM, { duration: 1 });
                        }
                    }, 360);
                });
            }

            // Desvanecer mapa + UI cuando se abre un globo
            leafletMap.on('popupopen', () => {
                const tilePan = leafletMap.getPane('tilePane');
                if (tilePan) tilePan.classList.add('map-dimmed');
                document.querySelector('.location-pill').classList.add('ui-dimmed');
            });
            leafletMap.on('popupclose', () => {
                const tilePan = leafletMap.getPane('tilePane');
                if (tilePan) tilePan.classList.remove('map-dimmed');
                document.querySelector('.location-pill').classList.remove('ui-dimmed');
            });

            // Botón recorre los eventos visibles en mapa; si no hay marcadores, vuelve al centro.
            document.getElementById('btn-recenter').addEventListener('click', () => {
                if (mapMarkers.length > 0) {
                    activeMapMarkerIndex = (activeMapMarkerIndex + 1) % mapMarkers.length;
                    const item = mapMarkers[activeMapMarkerIndex];
                    const marker = item.marker || item;
                    const latLng = marker.getLatLng();
                    leafletMap.flyTo(latLng, 16, { duration: 0.8 });
                    setTimeout(() => marker.openPopup(), 450);
                    return;
                }
                leafletMap.flyTo(MAP_CENTER, MAP_ZOOM, { duration: 0.8 });
            });
        }

        function clearMarkers() {
            mapMarkers.forEach(m => leafletMap.removeLayer(m.marker || m));
            mapMarkers = [];
            activeMapMarkerIndex = -1;
        }
        // ============================================================
        //  SISTEMA DE FILTRADO GLOBAL
        // ============================================================
        function getGlobalFilteredEvents() {
            const todayKey = formatDateKey(new Date());
            let activeEvents = allEvents.filter(e => e.activo === 'SI');
            let futureEvents = activeEvents.filter(e => e.fecha >= todayKey);
            let filtered = futureEvents.length > 0 ? futureEvents : activeEvents;

            // 1. Filtro por Búsqueda (Cualquier fecha)
            if (searchQuery.trim() !== '') {
                const q = searchQuery.toLowerCase().trim();
                filtered = filtered.filter(e =>
                    e.nombre.toLowerCase().includes(q) ||
                    e.lugar.toLowerCase().includes(q) ||
                    e.descripcion.toLowerCase().includes(q) ||
                    e.categoria.toLowerCase().includes(q)
                );
            }

            // 2. Filtro por Categoría (Búsqueda inteligente por nombre y categoría)
            if (selectedCategory !== 'Todos') {
                const searchKeys = {
                    'Música': ['musica', 'concierto', 'conciertos', 'banda', 'festival', 'live', 'show'],
                    'Deporte': ['deporte', 'deportes', 'carrera', 'futbol', 'torneo', 'maraton', 'sport'],
                    'Teatro': ['teatro', 'obra', 'comedia', 'drama', 'escenario', 'teatral'],
                    'Cultura': ['cultura', 'arte', 'exposicion', 'expo', 'feria', 'museo', 'galeria'],
                    'Salud': ['salud', 'medico', 'médico', 'doctor', 'bienestar', 'clinica', 'clínica']
                };

                const keys = searchKeys[selectedCategory] || [normalizeString(selectedCategory)];

                filtered = filtered.filter(e => {
                    const cat = normalizeString(e.categoria);
                    const name = normalizeString(e.nombre);
                    // Si alguna de nuestras llaves coincide con la categoría o el nombre del evento
                    return keys.some(k => cat.includes(k) || name.includes(k));
                });
            }

            return filtered;
        }


        function addMarkersForDate(date) {
            clearMarkers();

            // Usamos el filtro global + la fecha
            let filtered = getGlobalFilteredEvents();

            // Filtramos por fecha solo cuando aplica; en móvil, "Todos" muestra todos los eventos.
            const shouldFilterByDate = isDateFiltered && !(window.innerWidth < 1024 && selectedCategory === 'Todos' && searchQuery.trim() === '' && !forceDateFilterMobile);
            if (shouldFilterByDate) {
                filtered = filtered.filter(e => e.fecha === date);
            }

            filtered.forEach(ev => {
                const lat = parseFloat(ev.latitud || ev.lat);
                const lng = parseFloat(ev.longitud || ev.lng);

                if (isNaN(lat) || isNaN(lng)) {
                    console.warn(`Evento "${ev.nombre}" no tiene coordenadas válidas.`);
                    return;
                }

                const cls = CAT_CLASS[ev.categoria] || 'musica';
                const icon = getEventIcon(ev);
                const pinHtml = `<div class="map-pin ${cls}">${icon}</div>`;

                // Formatear fecha legible
                const [y, mo, d] = ev.fecha.split('-');
                const fechaLegible = `${parseInt(d)} ${MESES_ES[parseInt(mo) - 1]} ${y}`;

                const imgUrl = getImageUrl(ev.foto_portada, ev.nombre);
                const popupHtml = `
                    <div class="ev-popup">
                        <img src="${imgUrl}" class="ev-popup-img" alt="${ev.nombre}"
                             referrerpolicy="no-referrer"
                             onerror="this.src='https://images.unsplash.com/photo-1470229722913-7c0e2dbbafd3?w=800&q=60'">
                        <div class="ev-popup-body">
                            <div class="ev-popup-top">
                                <span class="cat-chip ${cls}" style="font-size:0.6rem;padding:3px 8px;">${ev.categoria}</span>
                            </div>
                            <div class="ev-popup-name">${ev.nombre}</div>
                            <div class="ev-popup-row">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                                <span>${ev.lugar}</span>
                            </div>
                            <div class="ev-popup-row">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                                <span>${fechaLegible}</span>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left:4px"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                                <span>${ev.hora}</span>
                            </div>
                            <button class="ev-popup-btn" onclick="window.__openEventDetail('${ev.id}')">Ver detalle</button>
                            <button class="share-btn share-btn-popup" onclick="window.__shareEvent('${ev.id}')">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
                            </button>
                        </div>
                    </div>`;

                const marker = L.marker([lat, lng], {
                    icon: L.divIcon({ html: pinHtml, className: '', iconSize: [36, 36], iconAnchor: [18, 18] })
                });

                marker.bindPopup(popupHtml, {
                    offset: [0, -20],
                    closeButton: false,
                    className: 'ev-leaflet-popup'
                });

                marker.addTo(leafletMap);
                mapMarkers.push({ marker, ev });
            });

            // Auto-ajustar el mapa segun la cantidad de eventos visibles.
            if (mapMarkers.length === 1) {
                const marker = mapMarkers[0].marker || mapMarkers[0];
                leafletMap.flyTo(marker.getLatLng(), 16, { animate: true, duration: 0.8 });
            } else if (mapMarkers.length > 1) {
                const group = L.featureGroup(mapMarkers.map(m => m.marker));
                leafletMap.fitBounds(group.getBounds().pad(0.3), { animate: true });
            } else {
                // Si no hay eventos, volver al centro por defecto (San Luis Potosí)
                leafletMap.setView([22.1565, -100.9855], 13);
            }

            // Exponer funciones globales para los botones del popup
            window.__openEventDetail = function (id) {
                const found = allEvents.find(e => e.id === id);
                if (found) { leafletMap.closePopup(); openDetail(found); }
            };

            window.__shareEvent = function (id) {
                handleShare(null, id);
            };

            window.__clearMobileSearch = function () {
                const searchInput = document.getElementById('mobile-search-input');
                const searchPanel = document.getElementById('mobile-search-panel');
                if (searchInput) searchInput.value = '';
                if (searchPanel) searchPanel.classList.remove('open');
                searchQuery = '';
                isDateFiltered = true;
                forceDateFilterMobile = true;
                renderEventsList();
                addMarkersForDate(selectedDate);
            };

            window.__showNextEvents = function () {
                const upcoming = getGlobalFilteredEvents()
                    .filter(e => e.fecha >= formatDateKey(new Date()))
                    .sort((a, b) => a.fecha.localeCompare(b.fecha));
                if (upcoming[0]) {
                    selectedDate = upcoming[0].fecha;
                    isDateFiltered = true;
                    forceDateFilterMobile = true;
                    buildDateSelector();
                    renderEventsList();
                    addMarkersForDate(selectedDate);
                }
            };
        }

        // ============================================================
        //  SELECTOR DE FECHAS
        // ============================================================
        function buildDateSelector() {
            const container = document.getElementById('date-scroll');
            if (!container) return;
            container.innerHTML = '';

            // Obtener fechas que pasan el filtro global (Categoría/Búsqueda)
            const filteredAll = getGlobalFilteredEvents();
            const fechasConEventos = [...new Set(filteredAll.map(e => e.fecha))].sort();

            const todayKey = formatDateKey(new Date());

            // Asegurar que haya algo que mostrar
            if (fechasConEventos.length === 0 && searchQuery.trim() === '' && selectedCategory === 'Todos') {
                fechasConEventos.push(todayKey);
            }

            if (fechasConEventos.length > 0 && !fechasConEventos.includes(selectedDate)) {
                selectedDate = fechasConEventos[0];
                isDateFiltered = window.innerWidth < 1024 && selectedCategory !== 'Todos';
                forceDateFilterMobile = false;
            }

            const likesByDate = new Map();
            filteredAll.forEach(ev => {
                const likes = ev._likes !== undefined ? ev._likes : parseInt(ev.likes, 10) || 0;
                likesByDate.set(ev.fecha, (likesByDate.get(ev.fecha) || 0) + likes);
            });
            const hotDate = [...likesByDate.entries()]
                .filter(([, likes]) => likes > 0)
                .sort((a, b) => b[1] - a[1])[0]?.[0] || '';

            let lastMonth = -1;

            fechasConEventos.forEach(key => {
                const d = parseDateKey(key);
                const currentMonth = d.getMonth();
                const isNewMonth = currentMonth !== lastMonth;
                lastMonth = currentMonth;

                const pill = document.createElement('div');
                pill.className = 'date-pill has-events' + (key === selectedDate ? ' active' : '') + (isNewMonth ? ' month-divider' : '') + (key === hotDate ? ' hot-date' : '');
                pill.dataset.date = key;
                const isToday = key === todayKey;
                const monthName = MESES_ES[currentMonth].toUpperCase();

                pill.innerHTML = `
                    <span class="day-label">${isToday ? 'HOY' : DAYS_ES[d.getDay()]}</span>
                    <span class="day-num">${d.getDate()}</span>
                    <span class="month-label">${monthName}</span>
                `;
                pill.addEventListener('click', () => selectDate(key, pill));
                container.appendChild(pill);
            });


            if (window.lucide) lucide.createIcons();


            document.querySelectorAll('.date-pill').forEach(p => p.classList.remove('active'));
            const activePill = [...container.children].find(c => c.dataset.date === selectedDate);
            if (activePill) activePill.classList.add('active');
        }

        function selectDate(key, pillEl) {
            isDateFiltered = true;
            forceDateFilterMobile = true;
            selectedDate = key;
            document.querySelectorAll('.date-pill').forEach(p => p.classList.remove('active'));
            pillEl.classList.add('active');
            renderEventsList();
            addMarkersForDate(key);
        }

        // ============================================================
        //  LISTA DE EVENTOS
        // ============================================================
        const MOBILE_CATEGORIES = ['Todos', 'Música', 'Deporte', 'Teatro', 'Cultura', 'Salud'];
        const CATEGORY_LABELS = {
            'Todos': 'TODOS',
            'Música': 'CONCIERTOS',
            'Deporte': 'DEPORTES',
            'Teatro': 'TEATRO',
            'Cultura': 'CULTURA',
            'Salud': 'SALUD'
        };

        function renderMobileCategoryChips() {
            const container = document.getElementById('mobile-category-chips');
            if (!container) return;

            container.innerHTML = MOBILE_CATEGORIES.map(cat =>
                `<button class="mobile-chip ${selectedCategory === cat ? 'active' : ''}" data-cat="${cat}">${CATEGORY_LABELS[cat]}</button>`
            ).join('');

            container.querySelectorAll('.mobile-chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    selectedCategory = chip.dataset.cat;
                    isDateFiltered = selectedCategory !== 'Todos';
                    forceDateFilterMobile = false;
                    renderMobileCategoryChips();
                    renderCategoryChips();
                    buildDateSelector();
                    renderEventsList();
                    addMarkersForDate(selectedDate);
                });
            });
        }

        function renderCategoryChips() {
            const container = document.getElementById('desktop-category-chips');
            if (!container) return;
            const categories = MOBILE_CATEGORIES;
            const labels = CATEGORY_LABELS;

            container.innerHTML = categories.map(cat => {
                const active = selectedCategory === cat ? 'active' : '';
                // Estilo especial para Cultura si está activo (gradiente rosa como en la imagen)
                const style = (cat === 'Cultura' && active) ? 'background: linear-gradient(90deg, #E91E63 0%, #FF4081 100%) !important; color: #fff !important; box-shadow: 0 10px 20px rgba(233, 30, 99, 0.3) !important; border: none !important; font-weight: 900;' : '';
                return `<div class="chip ${active}" data-cat="${cat}" style="${style}">${labels[cat]}</div>`;
            }).join('');

            // Agregar listeners de clic
            container.querySelectorAll('.chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    selectedCategory = chip.getAttribute('data-cat');
                    isDateFiltered = window.innerWidth < 1024 && selectedCategory !== 'Todos'; // En móvil "Todos" muestra todo.
                    forceDateFilterMobile = false;
                    renderCategoryChips();
                    renderMobileCategoryChips();
                    buildDateSelector();
                    renderEventsList();
                    addMarkersForDate(selectedDate);
                });
            });
        }

        function updateDesktopSummary(events = currentFilteredEvents) {
            const summaryEl = document.getElementById('upcoming-summary');
            if (!summaryEl) return;

            const count = events.length;
            const plural = count === 1 ? 'evento' : 'eventos';
            const found = count === 1 ? 'encontró' : 'encontraron';
            const query = searchQuery.trim();
            const categoryLabel = selectedCategory === 'Todos' ? 'eventos' : selectedCategory.toLowerCase();

            if (query) {
                summaryEl.innerHTML = `Se ${found} <b>${count}</b> ${plural} para "${query}".`;
            } else if (isDateFiltered && selectedCategory !== 'Todos') {
                summaryEl.innerHTML = `Hay <b>${count}</b> ${count === 1 ? 'evento' : 'eventos'} de ${categoryLabel} para esta fecha.`;
            } else if (isDateFiltered) {
                summaryEl.innerHTML = `Hay <b>${count}</b> ${plural} para esta fecha.`;
            } else if (selectedCategory !== 'Todos') {
                summaryEl.innerHTML = `Se ${found} <b>${count}</b> ${plural} de ${categoryLabel} disponibles.`;
            } else {
                summaryEl.innerHTML = `Se han encontrado <b>${count}</b> ${plural} disponibles.`;
            }

            summaryEl.style.display = 'block';
        }

        function updateUpcomingSummary() {
            const summaryEl = document.getElementById('upcoming-summary');
            if (!summaryEl) return;

            if (window.innerWidth >= 1024) {
                updateDesktopSummary(currentFilteredEvents);
                return;
            }

            const now = new Date();
            const currentMonth = now.getMonth();
            const currentYear = now.getFullYear();
            const todayStr = formatDateKey(now);

            const upcomingEvents = allEvents.filter(ev => {
                const [y, m, d] = ev.fecha.split('-').map(Number);
                const evDate = new Date(y, m - 1, d);
                // Mismo mes, mismo año y fecha >= hoy
                return y === currentYear && (m - 1) === currentMonth && ev.fecha >= todayStr;
            });

            const count = upcomingEvents.length;
            if (count > 0) {
                summaryEl.innerHTML = `Se han encontrado <b>${count}</b> ${count === 1 ? 'evento próximo' : 'eventos'} este mes a los que aún puedes asistir, regístrate las veces que quieras.`;
                summaryEl.style.display = 'block';
            } else {
                summaryEl.style.display = 'none';
            }
        }

        function formatMobileCardDate(fecha) {
            if (!fecha || !fecha.includes('-')) return 'FECHA';
            const [, month, day] = fecha.split('-');
            const monthLabel = MESES_ES[(parseInt(month, 10) || 1) - 1] || '';
            return `${parseInt(day, 10)} ${monthLabel}`.toUpperCase();
        }

        function getEventMapsUrl(ev) {
            const lat = parseFloat(ev.latitud || ev.lat);
            const lng = parseFloat(ev.longitud || ev.lng);
            if (!isNaN(lat) && !isNaN(lng)) {
                return `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
            }

            const query = [ev.direccion, ev.lugar, 'San Luis Potosí, S.L.P.']
                .filter(Boolean)
                .join(', ');
            return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query || ev.nombre || 'San Luis Potosí')}`;
        }

        function eventHasMedia(ev) {
            return Boolean((ev.video && ev.video.trim()) || (ev.fotos_extra && ev.fotos_extra.trim()));
        }

        function renderEventsList() {
            const container = document.getElementById('events-list');
            const countEl = document.getElementById('events-count');
            const countElDesktop = document.getElementById('events-count-desktop');

            let filtered = getGlobalFilteredEvents();
            const isMobile = window.innerWidth < 1024;
            const isSearching = searchQuery.trim() !== '';

            if (isMobile && !isSearching && (selectedCategory !== 'Todos' || forceDateFilterMobile)) {
                filtered = filtered.filter(e => e.fecha === selectedDate);
            } else if (!isMobile && isDateFiltered) {
                filtered = filtered.filter(e => e.fecha === selectedDate);
            }
            currentFilteredEvents = filtered; // Guardamos para navegación en modal

            const countText = filtered.length > 0
                ? `${filtered.length} ${filtered.length === 1 ? 'experiencia' : 'experiencias'}`
                : 'Sin eventos';

            const isCategoryFilter = selectedCategory !== 'Todos';

            const suffix = isMobile
                ? (isSearching ? ' resultados' : (selectedCategory === 'Todos' && !forceDateFilterMobile ? ' en total' : ' para este día'))
                : ((isSearching || isCategoryFilter || !isDateFiltered) ? ' encontradas' : ' para este día');
            if (countEl) countEl.textContent = countText + suffix;
            if (countElDesktop) countElDesktop.textContent = countText;
            if (!isMobile) updateDesktopSummary(filtered);

            if (filtered.length === 0) {
                container.classList.remove('single-event-list');
                const emptyMsg = isSearching
                    ? `No se encontraron resultados para "${searchQuery}".<br>Intenta con otra palabra clave.`
                    : (isCategoryFilter
                        ? `No se encontraron eventos en la categoría seleccionada.<br>Prueba con otra categoría o presiona "TODOS".`
                        : 'No hay eventos para este día.<br>Intenta con otra fecha.');
                const emptyAction = isSearching
                    ? `<button class="mobile-empty-action" onclick="window.__clearMobileSearch()">Limpiar búsqueda</button>`
                    : `<button class="mobile-empty-action" onclick="window.__showNextEvents()">Ver próximos eventos</button>`;

                container.innerHTML = `
            <div class="no-events">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="3" y="4" width="18" height="18" rx="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                <p>${emptyMsg}</p>
                ${isMobile ? emptyAction : ''}
            </div>`;
                return;
            }

            container.innerHTML = '';
            const isDesktop = window.innerWidth >= 1024;
            container.classList.toggle('single-event-list', isDesktop && filtered.length === 1);
            filtered.forEach(ev => {
                const cls = CAT_CLASS[ev.categoria] || 'musica';
                const liked = getLikedEvents();
                const isLiked = liked.has(ev.id);
                if (ev._likes === undefined) ev._likes = parseInt(ev.likes) || 0;

                const imgUrl = getImageUrl(ev.foto_portada, ev.nombre);
                const card = document.createElement('div');
                card.className = 'event-card';
                const [y, mo, d] = ev.fecha.split('-');
                const displayCategory = ev.categoria || 'Evento';
                const displayTime = ev.hora || 'Por definir';
                const displayPlace = ev.lugar || 'Ubicación por confirmar';
                const mapsUrl = getEventMapsUrl(ev);
                if (!isDesktop) {
                    const displayDate = formatMobileCardDate(ev.fecha);
                    const hasMedia = eventHasMedia(ev);
                    card.style.setProperty('--bg-url', `url(${imgUrl})`);
                    card.innerHTML = `
            <img class="event-card-img" src="${imgUrl}" alt="${ev.nombre}"
                 referrerpolicy="no-referrer"
                 onerror="this.src='https://images.unsplash.com/photo-1470229722913-7c0e2dbbafd3?w=800&q=60'; this.referrerpolicy='no-referrer';">
            <div class="event-card-overlay"></div>
            <div class="event-card-content">
                <div class="event-card-top">
                    <div class="event-card-top-left">
                        <span class="cat-chip ${cls}">${displayCategory}</span>
                        ${hasMedia ? `<span class="media-chip" title="Contenido multimedia"><svg viewBox="0 0 24 24" fill="currentColor" style="width:13px;height:13px;"><path d="M8 5v14l11-7z"/></svg></span>` : ''}
                    </div>
                    <div class="event-card-schedule">
                        <span class="event-date-chip">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px;"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                            ${displayDate}
                        </span>
                        <span class="event-time">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px;opacity:0.8;"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                            ${displayTime}
                        </span>
                    </div>
                </div>
                <div class="event-card-bottom">
                    <div>
                        <div class="event-name">${ev.nombre}</div>
                        <div class="event-lugar">📍 ${displayPlace}</div>

                    const old = document.querySelector('script[src*="tiktok.com/embed.js"]');
                    if (old) old.remove();
                    const s = document.createElement('script');
                    s.async = true;
                    s.src = 'https://www.tiktok.com/embed.js';
                    document.body.appendChild(s);
                };
                setTimeout(processTikTok, 200);
                setTimeout(processTikTok, 800);
            }
        }
