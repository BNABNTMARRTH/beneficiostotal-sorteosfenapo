        // ============================================================
        //  CARGA DE DATOS DESDE GOOGLE SHEETS
        // ============================================================
        function parseCSV(text) {
            const rows = [];
            let curCol = '', curRow = [], inQ = false;

            for (let i = 0; i < text.length; i++) {
                const ch = text[i];
                const next = text[i + 1];

                if (ch === '"') {
                    if (inQ && next === '"') {
                        curCol += '"'; i++;
                    } else {
                        inQ = !inQ;
                    }
                } else if (ch === ',' && !inQ) {
                    curRow.push(curCol); curCol = '';
                } else if ((ch === '\n' || ch === '\r') && !inQ) {
                    curRow.push(curCol);
                    if (curRow.length > 1 || curRow[0] !== '') rows.push(curRow);
                    curRow = []; curCol = '';
                    if (ch === '\r' && next === '\n') i++;
                } else {
                    curCol += ch;
                }
            }
            if (curRow.length > 0 || curCol !== '') {
                curRow.push(curCol); rows.push(curRow);
            }

            const headers = rows[0].map(h => h.trim().replace(/^"|"$/g, ''));
            return rows.slice(1).map(row => {
                const obj = {};
                headers.forEach((h, i) => {
                    let val = (row[i] || '').trim();
                    if (val.startsWith('"') && val.endsWith('"')) {
                        val = val.substring(1, val.length - 1).replace(/""/g, '"');
                    }
                    obj[h] = val;
                });
                return obj;
            });
        }

        // Normalizar strings (quitar acentos y pasar a minúsculas) para búsquedas robustas
        function normalizeString(str) {
            if (!str) return '';
            return str.toString().normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
        }

        // Inferir categoría automáticamente cuando el campo está vacío
        function inferCategoria(nombre, descripcion) {
            const txt = normalizeString((nombre || '') + ' ' + (descripcion || ''));
            if (/\bvs\b|versus|partido|torneo|liga|fut(bol)?|basket|tenis|volei|maraton|carrera|deporte|atletismo|lucha|box(eo)?|campeonato|semifinal|final/.test(txt)) return 'Deporte';
            if (/concierto|banda|musica|festival|show|live|tributo|orquesta|dj\b|cumbia|rock|pop\b|jazz|reggae|rap\b|hip.?hop/.test(txt)) return 'Música';
            if (/teatro|obra|comedia|drama|monolog|escenario|teatral|actuacion|musicales/.test(txt)) return 'Teatro';
            if (/expo|exposicion|museo|galeria|feria|cultura|arte\b|pintura|escultura|fotografia/.test(txt)) return 'Cultura';
            if (/gastronomia|cena|degustacion|chef|cocina|sabores|food|tacos|restaurant/.test(txt)) return 'Gastronomía';
            return '';
        }

        async function loadEvents() {
            try {
                // Si la URL del sheet está configurada, intenta cargar
                if (SHEET_CSV_URL.includes('TU_ID_DE_SHEET_AQUI')) {
                    throw new Error('Sheet no configurado — usando datos de demo');
                }
                const res = await fetch(SHEET_CSV_URL);
                const text = await res.text();
                const rawData = parseCSV(text);

                // Normalización de datos (Asegurar que los nombres de propiedades coincidan)
                allEvents = rawData.map(ev => ({
                    id: ev.ID || ev.id || Math.random().toString(36).substr(2, 9),
                    nombre: ev.Nombre || ev.nombre || '',
                    fecha: normalizeDate(ev.Fecha || ev.fecha || ''),
                    hora: ev.Hora || ev.hora || '',
                    lugar: ev.Lugar || ev.lugar || '',
                    categoria: ev.Categoría || ev.categoria || ev.Categoria || inferCategoria(ev.Nombre || ev.nombre, ev.Descripcion || ev.descripcion),
                    foto_portada: ev['Foto Portada'] || ev.foto_portada || ev.Foto_Portada || '',
                    fotos_extra: ev['Fotos Extra'] || ev.fotos_extra || ev.Fotos_Extra || '',
                    likes: ev.Likes || ev.likes || '0',
                    video: ev.Video || ev.video || '',
                    latitud: ev.Latitud || ev.latitud || ev.lat || '',
                    longitud: ev.Longitud || ev.longitud || ev.lng || '',
                    descripcion: ev.Descripcion || ev.descripcion || '',
                    direccion: ev.Direccion || ev.direccion || '',
                    lineup: ev.Lineup || ev.lineup || ev.Invitado || ev.invitado || '',
                    activo: ev.Activo || ev.activo || 'SI'
                })).filter(e => (e.activo === 'SI' || e.activo === 'Sí') && e.nombre && e.fecha && /^\d{4}-\d{2}-\d{2}$/.test(e.fecha));

                console.log('Eventos cargados:', allEvents.length);
            } catch (e) {
                console.warn('⚠️ ' + e.message);
                allEvents = DEMO_EVENTS;
            }

            if (!allEvents || allEvents.length === 0) {
                allEvents = DEMO_EVENTS;
            }

            if (selectedCategory === 'Todos') {
                isDateFiltered = false;
            }

            buildDateSelector();
            renderEventsList();
            addMarkersForDate(selectedDate);
            updateUpcomingSummary();
            checkHighlightLikes();
        }

        function checkHighlightLikes() {
            if (window.location.search.includes('highlight=likes')) {
                setTimeout(() => {
                    const likeBtns = document.querySelectorAll('.like-btn');
                    if (likeBtns.length > 0) {
                        likeBtns[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                    likeBtns.forEach(btn => {
                        btn.classList.add('mission-glow-lilac');
                        setTimeout(() => {
                            btn.classList.remove('mission-glow-lilac');
                        }, 4500);
                    });
                }, 600);
            }
        }

        // ============================================================
        //  LIGHTBOX LOGIC
        // ============================================================
        let currentPhotoIdx = 0;

        function updateLightboxUI() {
            const photos = window.__currentPhotos || [];
            const lb = document.getElementById('lightbox');

            // Counter
            const counter = document.getElementById('lightbox-counter');
            if (counter) counter.textContent = `${currentPhotoIdx + 1} / ${photos.length}`;

            // Single-img class
            if (photos.length <= 1) lb.classList.add('single-img');
            else lb.classList.remove('single-img');

            // Thumbnails
            const thumbsEl = document.getElementById('lightbox-thumbs');
            if (thumbsEl) {
                thumbsEl.innerHTML = photos.map((url, i) =>
                    `<img class="lightbox-thumb${i === currentPhotoIdx ? ' active' : ''}"
                         src="${url}" alt="Miniatura ${i + 1}"
                         onclick="window.__openLightbox(${i})">`
                ).join('');
                // Scroll activa al centro
                const activeThumb = thumbsEl.querySelector('.active');
                if (activeThumb) activeThumb.scrollIntoView({ inline: 'center', behavior: 'smooth' });
            }
        }

        function openLightbox(idx) {
            const photos = window.__currentPhotos || [];
            if (!photos[idx]) return;
            const img = document.getElementById('lightbox-img');

            currentPhotoIdx = idx;
            img.src = photos[idx];
            updateLightboxUI();

            document.getElementById('lightbox').classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function navigateLightbox(dir) {
            const photos = window.__currentPhotos || [];
            const img = document.getElementById('lightbox-img');

            // Fade out
            img.style.opacity = '0';
            img.style.transform = 'scale(0.96)';
            setTimeout(() => {
                currentPhotoIdx = (currentPhotoIdx + dir + photos.length) % photos.length;
                img.src = photos[currentPhotoIdx];
                img.style.opacity = '1';
                img.style.transform = 'scale(1)';
                updateLightboxUI();
            }, 160);
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('open');
            document.body.style.overflow = '';
        }

        window.__openLightbox = openLightbox;
        document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
        document.getElementById('lightbox-prev').addEventListener('click', (e) => { e.stopPropagation(); navigateLightbox(-1); });
        document.getElementById('lightbox-next').addEventListener('click', (e) => { e.stopPropagation(); navigateLightbox(1); });
        document.getElementById('lightbox-content').addEventListener('click', closeLightbox);

        // Teclado
        document.addEventListener('keydown', e => {
            if (!document.getElementById('lightbox').classList.contains('open')) return;
            if (e.key === 'ArrowRight') navigateLightbox(1);
            else if (e.key === 'ArrowLeft') navigateLightbox(-1);
            else if (e.key === 'Escape') closeLightbox();
        });

        // Swipe móvil
        let touchStartX = 0;
        document.getElementById('lightbox').addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX, { passive: true });
        document.getElementById('lightbox').addEventListener('touchend', e => {
            const dx = e.changedTouches[0].screenX - touchStartX;
            if (Math.abs(dx) > 50) navigateLightbox(dx < 0 ? 1 : -1);
        });

        // ============================================================
        //  INICIALIZACIÓN
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            applySavedTheme();
            if (window.innerWidth >= 1024) {
                document.querySelector('.cal-wrapper')?.classList.add('map-off');
                document.getElementById('cal-map')?.classList.add('hidden');
            }
            lucide.createIcons();
            initMap();
            setupMobileControls();
            loadEvents();
            renderCategoryChips();
            renderMobileCategoryChips();

            // Convertir automáticamente a mayúsculas los textos del modal de participación
            ['pform-nombre', 'pform-cuenta'].forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.addEventListener('input', (e) => {
                        e.target.value = e.target.value.toUpperCase();
                    });
                }
            });

            // Convertir automáticamente a minúsculas el correo
            const emailEl = document.getElementById('pform-email');
            if (emailEl) {
                emailEl.addEventListener('input', (e) => {
                    e.target.value = e.target.value.toLowerCase();
                });
            }

            // Search desktop logic
            const searchInput = document.getElementById('search-input-desktop');
            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    searchQuery = e.target.value;
                    isDateFiltered = false; // Al buscar, mostramos resultados globales
                    buildDateSelector(); // Actualizar fechas disponibles
                    renderEventsList();
                    addMarkersForDate(selectedDate);
                });
            }

            // Chips desktop logic
            const chips = document.querySelectorAll('#desktop-category-chips .chip');
            chips.forEach(chip => {
                chip.addEventListener('click', () => {
                    chips.forEach(c => c.classList.remove('active'));
                    chip.classList.add('active');
                    selectedCategory = chip.getAttribute('data-cat');
                    isDateFiltered = window.innerWidth < 1024 && selectedCategory !== 'Todos';
                    renderMobileCategoryChips();
                    buildDateSelector(); // Actualizar fechas disponibles para esta categoría
                    renderEventsList();
                    addMarkersForDate(selectedDate);
                });
            });
        });
    </script>
